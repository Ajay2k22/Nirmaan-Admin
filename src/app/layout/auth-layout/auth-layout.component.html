<div class="auth-wrapper">
  <div class="auth-container">
    <div class="brand">
      <div class="nm-box">NM</div>
      <div class="brand-title">
        <h1>Nirmaan</h1>
        <span class="ver">v2.4</span>
      </div>
      <div class="portal-chip">
        <span class="dot"></span> Citizen Service Portal
      </div>
    </div>

    <div class="officer-card">
      <div class="officer-head">
        <div>
          <h2>{{ title }}</h2>
          <p>{{ subtitle }}</p>
        </div>
        <!-- <div class="id-box">ID</div> -->
      </div>
      <ng-content></ng-content>
    </div>

    <div class="auth-footer">
      <div class="gov-chip">Govt. of Maharashtra • Civic Infra Tech</div>
      <div class="secure-line">
        <span class="b-dot"></span> 256-Bit SSL Secured
        <span class="sep">•</span> Emergency Desk
      </div>
    </div>
  </div>
</div>
